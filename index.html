let currentCoverHeight = 75; // النسبة المئوية الافتراضية

function changeCoverSize(amount) {
 currentCoverHeight += amount;
 if (currentCoverHeight < 30) currentCoverHeight = 30; // الحد الأدنى للجماليات
 if (currentCoverHeight > 75) currentCoverHeight = 75; // الحد الأقصى لكي لا تضغط النصوص

}

 const savedHeight = localStorage.getItem('store_cover_height');

  currentCoverHeight = parseInt(savedHeight);
  document.documentElement.style.setProperty('--cover-height', currentCoverHeight + '%');

});

const games = raw.trim().split("\n")
 .map(line=>line.trim())
 .filter(Boolean)
 .map((line)=>{
   const [name,cusa,size,source,genre,year]=line.split("|");
   return {
    name: name.trim(),
    cusa: cusa.trim(),
    size: size.trim(),
    source: source.trim(),
    genre: genre.trim(),
    year: year ? year.trim() : "—"
   };
 })
 .sort((a, b) => {
   if (a.genre !== b.genre) return a.genre.localeCompare(b.genre);
   return a.name.localeCompare(b.name, 'en', { sensitivity: 'accent' });
 })
 .map((game, index) => ({
   number: index + 1,
   ...game
 }));

  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function coverHTML(game){
 const url = covers[game.cusa];
 if(url && url.startsWith("http")){
  return `<img src="${escapeHTML(url)}" alt="${escapeHTML(game.name)}" onerror="this.outerHTML='<div class=\\'cover-placeholder\\'><strong>PS4</strong><small>STORE DAKHLA</small></div>'">`;
 }
 return `
 <div class="cover-placeholder">
  <strong>PS4</strong>
  <small>STORE DAKHLA</small>
 </div>`;
}

// تخزين الألعاب المختارة في السلة المتعددة مع كامل التفاصيل
let selectedCart = [];

function toggleCart(gameNumber) {
 const game = games.find(g => g.number === gameNumber);
 if (!game) return;

 const index = selectedCart.findIndex(item => item.number === gameNumber);
 if (index > -1) {
  selectedCart.splice(index, 1);
 } else {
  selectedCart.push(game);
 }
 updateCartUI();
}

function updateCartUI() {
 const cartDiv = document.getElementById("floatingCart");
 const cartCount = document.getElementById("cartCount");
 cartCount.textContent = selectedCart.length;
 if (selectedCart.length > 0) {
  cartDiv.style.display = "flex";
 } else {
  cartDiv.style.display = "none";
 }
}

function sendCartToWhatsApp() {
 if (selectedCart.length === 0) return;
 let text = "أريد طلب الألعاب التالية:\n";
 selectedCart.forEach((item, idx) => {
  text += `${idx + 1}. *${item.name}* (${item.source || '—'}) _ ${item.size}\n`;
 });
 const encoded = encodeURIComponent(text);
 window.open(`https://wa.me/212777497771?text=${encoded}`, '_blank');
}

function makeCard(g){
 const waText = encodeURIComponent(`${g.name} (${g.source || '—'}) _ ${g.size}`);
 const waSingleLink = `https://wa.me/212777497771?text=${waText}`;
 const language = gameLanguages[g.name] || "الإنجليزية";
 const isChecked = selectedCart.some(item => item.number === g.number) ? "checked" : "";

 return `
 <div class="game-card">
  <input type="checkbox" class="game-checkbox" ${isChecked} onchange="toggleCart(${g.number})" title="حدد لإضافة السلة">
  ${coverHTML(g)}
  <div class="game-name">${escapeHTML(g.name)}</div>
  <div class="genre-tag">${escapeHTML(genreLabels[g.genre]||g.genre)}</div>
  
  <div class="game-meta">
    الكود: <span dir="ltr">${escapeHTML(g.cusa||"—")}</span>
    | الإصدار: <span dir="ltr">${escapeHTML(g.year)}</span><br>

    الحجم: <span dir="ltr">${escapeHTML(g.size)}</span>
    | المصدر: <span dir="ltr">${escapeHTML(g.source)}</span><br>

    🌐 اللغة:
    <strong style="color:#0756a5">
        ${escapeHTML(language)}
    </strong>
  </div>

  <a href="${waSingleLink}" target="_blank" class="card-wa-btn">
   🛒 اطلب عبر واتساب
  </a>
 </div>`;
}

function makePage(title,items,pageNo,totalPages){
 const cards=items.map(makeCard).join("");
 return `
 <section class="page">
  <h2 class="section-title">${escapeHTML(title)}</h2>
  <div class="page-info">
   ${items.length} ألعاب • صفحة ${pageNo} من ${totalPages}
  </div>
  <div class="games-grid">${cards}</div>
  <div class="footer">
   <span>• STORE DAKHLA •</span>
   <span>• واتساب: 0777497771 •</span>
  </div>
 </section>`;
}

function render(){
 const query=document.getElementById("search").value.toLowerCase();
 const genre=document.getElementById("genre").value;
 const source = '';

 let filtered=games.filter(g=>{
  const text=[g.name,g.cusa,g.size,g.source,g.genre,g.year,
              genreLabels[g.genre]||"",String(g.number)].join(" ").toLowerCase();
  return text.includes(query) &&
   (!genre||g.genre===genre) &&
   (!source||g.source===source);
 });

 //document.getElementById("count").textContent =
  //`النتائج: ${filtered.length} من أصل ${games.length} لعبة`;

 let html="";
 
 if(!query && !genre && !source) {
  html += makeStoreCoverPage();
 }

 const categories=genre?[genre]:genres;

 categories.forEach(category=>{
  const list=filtered.filter(g=>g.genre===category);
  if(!list.length)return;

  const chunks=[];
  for(let i=0;i<list.length;i+=12)
   chunks.push(list.slice(i,i+12));

  chunks.forEach((chunk,index)=>{
   html+=makePage(
    genreLabels[category]||category,
    chunk,index+1,chunks.length
   );
  });
 });

 if(!html){
  html='<section class="page"><h2 style="text-align:center;margin-top:50px;">لا توجد نتائج مطابقة لبحثك</h2></section>';
 }
 catalogue.innerHTML=html;
}

function resetFilters(){
 document.getElementById("search").value="";
 document.getElementById("genre").value="";
 document.getElementById("source").value="";
 render();
}

render();
